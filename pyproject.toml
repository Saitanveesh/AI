[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgewatch-observer"
version = "0.1.0"
description = "Passive, operator-supervised edge vision observation system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - evaluation"}
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.7,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
edgewatch = "edgewatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edgewatch = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
