name: Python validation

on:
  push:
    branches: [main, feat/**]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Python 3.11 / simulation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src
      - name: Lint critical errors and unused imports
        run: ruff check src tests --select E4,E7,E9,F
      - name: Unit and integration tests
        run: pytest
      - name: CLI configuration validation
        run: edgewatch check
      - name: Offline benchmark smoke test
        run: edgewatch benchmark --frames 15
      - name: Offline annotation-evaluation smoke test
        run: edgewatch evaluate --dataset examples/evaluation/sample.jsonl --iou 0.5
